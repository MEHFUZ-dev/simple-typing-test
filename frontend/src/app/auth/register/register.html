<div class="min-h-screen bg-[#323437] flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-[#2c2e31] p-8 rounded-xl">

    <h1 class="text-3xl text-white font-semibold text-center mb-8">
      Create Account
    </h1>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <!-- Username -->
      <div class="mb-5">
        <label class="block text-gray-300 mb-2">
          Username
        </label>

        <input
          type="text"
          formControlName="username"
          placeholder="Enter username"
          class="w-full px-4 py-3 rounded-lg bg-[#323437] text-white
                 border border-gray-600 focus:outline-none focus:border-yellow-400"
        >
      </div>

      <!-- Email -->
      <div class="mb-5">
        <label class="block text-gray-300 mb-2">
          Email
        </label>

        <input
          type="email"
          formControlName="email"
          placeholder="Enter email"
          class="w-full px-4 py-3 rounded-lg bg-[#323437] text-white
                 border border-gray-600 focus:outline-none focus:border-yellow-400"
        >
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label class="block text-gray-300 mb-2">
          Password
        </label>

        <input
          type="password"
          formControlName="password"
          placeholder="Enter password"
          class="w-full px-4 py-3 rounded-lg bg-[#323437] text-white
                 border border-gray-600 focus:outline-none focus:border-yellow-400"
        >
      </div>

      <button
        type="submit"
        class="w-full py-3 rounded-lg bg-yellow-400 text-gray-900
               font-semibold hover:bg-yellow-300 transition"
      >
        Register
      </button>

    </form>

  </div>

</div>
