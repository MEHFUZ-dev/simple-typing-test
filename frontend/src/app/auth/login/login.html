<div class="min-h-screen bg-[#323437] flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-[#2c2e31] p-8 rounded-xl">

    <h1 class="text-3xl text-white font-semibold text-center mb-8">
      Login1
    </h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="mb-5">

        <label class="block text-gray-300 mb-2">
          Username
        </label>

        <input
          type="text"
          formControlName="username"
          placeholder="Enter username"
          class="w-full px-4 py-3 rounded-lg bg-[#323437]
                 text-white border border-gray-600
                 focus:outline-none focus:border-yellow-400"
        >

      </div>

      <div class="mb-6">

        <label class="block text-gray-300 mb-2">
          Password
        </label>

        <input
          type="password"
          formControlName="password"
          placeholder="Enter password"
          class="w-full px-4 py-3 rounded-lg bg-[#323437]
                 text-white border border-gray-600
                 focus:outline-none focus:border-yellow-400"
        >

      </div>

      <button
        type="submit"
        class="w-full py-3 rounded-lg bg-yellow-400
               text-gray-900 font-semibold
               hover:bg-yellow-300 transition"
      >
        Login
      </button>
      <div class="flex items-center gap-3 my-6">
  <div class="flex-1 h-px bg-gray-700"></div>
  <span class="text-gray-500 text-sm">OR</span>
  <div class="flex-1 h-px bg-gray-700"></div>
</div>

<button
  type="button"
  (click)="loginWithGoogle()"
  class="w-full py-3 rounded-lg bg-white text-gray-900 font-semibold hover:bg-gray-200 transition">
  Continue with Google
</button>

    </form>

  </div>

</div>
